review(){const k=F.rt=='w'?'W'+weekStart(TD()):'D'+TD(),r=D.reviews.find(x=>x.key==k)||{},a=F.rt=='w'?D.tasks.filter(t=>t.due>=weekStart(TD())&&t.due<=iso(new Date(new Date(weekStart(TD())+'T12:00').getTime()+6*864e5))):D.tasks.filter(t=>t.due==TD()),dn=a.filter(t=>t.st=='done').length,hb=D.habits.filter(h=>(h.log||[]).includes(TD())).length;
const by=[0,0,0,0,0,0,0];a.forEach(t=>t.st=='done'&&by[new Date(t.due+'T12:00').getDay()]++);const bi=by.indexOf(Math.max(...by));
return`<div class=chips><button class="${F.rt!='w'?'on':''}" onclick="F.rt='d';R()">يومية</button><button class="${F.rt=='w'?'on':''}" onclick="F.rt='w';R()">أسبوعية</button></div><div class=card><div class=grid><div class=st><b>${a.length}</b>مخططة</div><div class=st><b>${dn}</b>مكتملة</div><div class=st><b>${pct(dn,a.length)}%</b>إنجاز</div><div class=st><b>${a.filter(late).length}</b>متأخرة</div></div><p class=m>غير مكتملة: ${a.filter(t=>t.st!='done').map(t=>e(t.title)).join('، ')||'—'}<br>مواعيد: ${D.events.filter(x=>F.rt=='w'?x.date>=weekStart(TD()):x.date==TD()).length} • عادات اليوم المنجزة: ${hb}/${D.habits.filter(h=>sch(h,new Date())).length}${F.rt=='w'&&dn?'<br>أفضل يوم: '+DN[bi]:''}</p></div><div class=card><form onsubmit="rv(event,'${k}')"><label>${F.rt=='w'?'الإنجازات':'أهم الإنجازات'}<textarea name=wins>${e(r.wins)}</textarea></label><label>الصعوبات والملاحظات<textarea name=hard>${e(r.hard)}</textarea></label><label>${F.rt=='w'?'أهداف الأسبوع القادم':'أهم 3 أولويات للغد'}<textarea name=next>${e(r.next)}</textarea></label><label>تقييمي (1-5)<input name=score type=number min=1 max=5 value="${e(r.score)}"></label><button class=b>حفظ المراجعة</button></form></div><h3>المراجعات السابقة</h3>${D.reviews.filter(x=>x.key[0]==(F.rt=='w'?'W':'D')).sort((a,b)=>b.key.localeCompare(a.key)).map(x=>`<div class=card><b>${x.key.slice(1)}</b> ⭐${e(x.score||'')}<div class=m style="white-space:pre-wrap">${e(x.wins)}\n${e(x.hard)}\n${e(x.next)}</div></div>`).join('')||empty('لا مراجعات محفوظة')}`},
reports(){const p=+(F.rp||30),from=p?iso(new Date(Date.now()-p*864e5)):'0000',a=D.tasks.filter(t=>t.due>=from&&t.due<=TD()+'z'),cnt=(arr,f)=>{const o={};arr.forEach(x=>{const k=f(x);o[k]=(o[k]||0)+1});return o},bars=o=>Object.entries(o).map(([k,v])=>`<div>${e(k)} (${v})<div class=bar><i style="width:${pct(v,a.length)}%"></i></div></div>`).join('')||'<span class=m>—</span>',d=a.filter(x=>x.st=='done').length;
return`<div class="row np"><h2 style="flex:1">التقارير</h2><select style="width:auto" onchange="F.rp=this.value;R()">${[[7,'7 أيام'],[30,'30 يوماً'],[90,'90 يوماً'],[0,'الكل']].map(x=>`<option value=${x[0]} ${p==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class=g onclick="print()">🖨️ طباعة/PDF</button><button class=g onclick="csv()">CSV</button></div><div class=card><div class=grid><div class=st><b>${a.length}</b>مهام</div><div class=st><b>${pct(d,a.length)}%</b>إنجاز</div><div class=st><b>${a.filter(late).length}</b>متأخرة</div></div></div><div class=card><h3>حسب الحالة</h3>${bars(cnt(a,t=>ST[t.st]))}</div><div class=card><h3>حسب الأولوية</h3>${bars(cnt(a,t=>PR[t.pr]))}</div><div class=card><h3>حسب التصنيف</h3>${bars(cnt(a,t=>t.cat||'بدون'))}</div><div class=card><h3>الموظفون</h3>${D.team.map(m=>{const x=a.filter(t=>t.who==m.id);return`<div>${e(m.name)}: ${x.filter(t=>t.st=='done').length}/${x.length}</div>`}).join('')||'—'}</div><div class=card><h3>المشاريع</h3>${D.projects.map(m=>{const x=D.tasks.filter(t=>t.project==m.id);return`<div>${e(m.name)}: ${pct(x.filter(t=>t.st=='done').length,x.length)}%</div>`}).join('')||'—'}</div><div class=card><h3>العادات (30 يوماً)</h3>${D.habits.map(h=>`<div>${e(h.name)}: ${(()=>{const r=hs(h,30);return pct(r[0],r[1])})()}%</div>`).join('')||'—'}</div>`},
set(){return`<h2>الإعدادات</h2><div class=card><label>اسم المستخدم<input value="${e(S.name)}" onchange="S.name=this.value;sv();toast('تم الحفظ')"></label><label>المظهر<select onchange="S.theme=this.value;sv();R()"><option value=light ${S.theme=='light'?'selected':''}>نهاري</option><option value=dark ${S.theme=='dark'?'selected':''}>ليلي</option></select></label><label>بداية الأسبوع<select onchange="S.wk=+this.value;sv()">${[6,0,1].map(i=>`<option value=${i} ${S.wk==i?'selected':''}>${DN[i]}</option>`).join('')}</select></label><label>الوقت<select onchange="S.h24=this.value=='1';sv();R()"><option value=1 ${S.h24?'selected':''}>24 ساعة</option><option value=0 ${!S.h24?'selected':''}>12 ساعة</option></select></label><label>التذكيرات<select onchange="S.remind=this.value=='1';sv();if(S.remind&&window.Notification)Notification.requestPermission()"><option value=1 ${S.remind?'selected':''}>مفعلة</option><option value=0 ${!S.remind?'selected':''}>معطلة</option></select></label><p class=m>التذكيرات تُفحص أثناء فتح التطبيق فقط؛ الإشعارات في الخلفية تعتمد على المتصفح ونظام التشغيل.</p></div>
<div class=card><h3>اللغة</h3><select onchange="S.lang=this.value;sv();setLang();R()"><option value=ar ${S.lang=='ar'?'selected':''}>العربية</option><option value=fr ${S.lang=='fr'?'selected':''}>Français</option></select></div>
<div class=card><h3>إدارة التصنيفات</h3>${S.cats.map((c,i)=>`<span class=tag>${e(c)} <b onclick="delCat(${i})" style="cursor:pointer">✕</b></span>`).join('')}<div style="margin-top:8px"><button class=g onclick="addCat()">+ إضافة تصنيف</button></div></div>
<div class=card><h3>إدارة الأولويات</h3>${ob(PR).map((x,i)=>`<label>مستوى ${i+1}<input value="${e(x[1])}" onchange="renPr('${x[0]}',this.value)"></label>`).join('')}</div>
<div class=card><h3>إدارة الموظفين</h3><button class=g onclick="go('team')">فتح قسم الفريق</button></div>
<div class=card><h3>رمز PIN</h3><p class=m>قفل للواجهة وليس تشفيراً للبيانات.</p><button class=b onclick="setPin()">${S.pin?'تغيير':'تفعيل'} PIN</button> ${S.pin?'<button class=g onclick="delPin()">إلغاء القفل</button>':''}</div>
<div class=card><h3>النسخ الاحتياطي</h3><p class=m>آخر نسخة: ${S.bk||'لم تؤخذ بعد'}</p><button class=b onclick="bk()">تصدير JSON</button> <label class=g style="display:inline-block;cursor:pointer">استعادة<input type=file accept=.json hidden onchange="rs(this.files[0])"></label></div>
<div class=card><button class=r onclick="reset()">إعادة ضبط التطبيق</button></div>`}};
/* actions */
function n2t(id){const n=D.notes.find(x=>x.id==id);ed('tasks','',{title:n.title,desc:n.body,project:n.project})}
function hl(id){const h=D.habits.find(x=>x.id==id);h.log=h.log||[];const i=h.log.indexOf(TD());i<0?h.log.push(TD()):h.log.splice(i,1);save();R()}
function log(id){return D.tasks.filter(t=>t.project==id).sort((a,b)=>(b.doneAt||b.created||'').localeCompare(a.doneAt||a.created||'')).map(t=>(t.doneAt||t.created)+' '+(t.st=='done'?'✔ أُنجزت':'+ أُضيفت')+': '+t.title).join('\n')||'لا نشاط'}
function rv(ev,k){ev.preventDefault();const o={key:k};new FormData(ev.target).forEach((v,x)=>o[x]=v);const i=D.reviews.findIndex(x=>x.key==k);i<0?D.reviews.push(o):D.reviews[i]=o;save();R();toast('تم حفظ المراجعة')}
function csv(){const r=[['العنوان','التاريخ','الحالة','الأولوية','المشروع','المسؤول'].map(T)].concat(D.tasks.map(t=>[t.title,t.due,ST[t.st],PR[t.pr],nm('projects',t.project),nm('team',t.who)]));dl('\ufeff'+r.map(x=>x.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n'),'yawmi-tasks.csv','text/csv')}
function dl(c,n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function bk(){dl(JSON.stringify({app:'YAWMI',v:1,at:new Date().toISOString(),data:D,settings:{...S,pin:undefined}}),'YAWMI-backup-'+TD()+'.json','application/json');S.bk=new Date().toLocaleString('ar');sv();R()}
async function rs(f){if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!='YAWMI'||!j.data||!K.every(k=>Array.isArray(j.data[k])))throw 0;if(!confirm('سيتم استبدال البيانات الحالية. تم حفظ نسخة احتياطية تلقائية قبل الاستعادة. متابعة؟'))return;await kv('prev',D);D=j.data;await save();gen();R();toast('تمت الاستعادة')}catch(x){toast('ملف غير صالح — لم تتغير بياناتك')}}
async function reset(){if(confirm('حذف كل البيانات نهائياً؟')&&confirm('هل أنت متأكد؟ يفضل أخذ نسخة احتياطية أولاً.')){await kv('prev',D);D={};K.forEach(k=>D[k]=[]);await save();toast('تمت إعادة الضبط');R()}}
/* PIN */
const hash=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('yawmi'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function setPin(){if(S.pin&&!(await hash(prompt('الرمز الحالي')||'')==S.pin))return toast('رمز خاطئ');const p=prompt('رمز جديد (4-6 أرقام)');if(!/^\d{4,6}$/.test(p||''))return toast('الرمز يجب أن يكون 4-6 أرقام');S.pin=await hash(p);sv();R();toast('تم الحفظ')}
async function delPin(){if(await hash(prompt('أدخل الرمز')||'')==S.pin){delete S.pin;sv();R();toast('أُلغي القفل')}else toast('رمز خاطئ')}
function lock(){if(!S.pin)return;const l=$('#lk');l.hidden=false;l.innerHTML='<div><h2>YAWMI 🔒</h2><input id=pi type=password inputmode=numeric maxlength=6><p id=pe></p></div>';$('#pi').oninput=async x=>{if(x.target.value.length>=4&&await hash(x.target.value)==S.pin){l.hidden=true}else if(x.target.value.length==6){$('#pe').textContent=T('رمز خاطئ');x.target.value=''}};$('#pi').focus()}
/* reminders */
function chk(){if(!S.remind)return;const f=JSON.parse(localStorage.yf||'{}'),now=Date.now();const fire=(k,t,b)=>{if(f[k])return;f[k]=1;toast('⏰ '+t);try{window.Notification&&Notification.permission=='granted'&&new Notification(T(t),{body:T(b),icon:'icon.svg'})}catch(x){}};
D.tasks.forEach(t=>{if(t.rem!==''&&t.rem!=null&&t.time&&t.due&&!['done','cancel'].includes(t.st)){const w=new Date(t.due+'T'+t.time).getTime()-t.rem*6e4;if(now>=w&&now<w+864e5)fire(t.id+t.due,t.title,'موعد المهمة '+tm(t.time))}});
D.events.forEach(t=>{if(t.rem!==''&&t.rem!=null&&t.from){const w=new Date(t.date+'T'+t.from).getTime()-t.rem*6e4;if(now>=w&&now<w+864e5)fire('e'+t.id+t.date,t.title,'موعد '+tm(t.from))}});localStorage.yf=JSON.stringify(f)}
/* init */
(async()=>{try{D=(await kv('data'))||{}}catch(x){D={}}K.forEach(k=>D[k]=D[k]||[]);gen();await save();setLang();document.documentElement.dataset.th=S.theme;R();lock();chk();setInterval(()=>{$('#clk').textContent=new Date().toLocaleTimeString(S.lang=='fr'?'fr':'ar',{hour12:!S.h24,hour:'2-digit',minute:'2-digit'});chk()},1e3);
if(S.remind&&window.Notification&&Notification.permission=='default')document.addEventListener('click',()=>Notification.requestPermission(),{once:true});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
